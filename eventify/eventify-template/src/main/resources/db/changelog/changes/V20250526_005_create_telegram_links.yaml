databaseChangeLog:
  - changeSet:
      id: 005-create-telegram-links
      author: eventify
      changes:
        - createTable:
            tableName: telegram_links
            columns:
              - column: {name: id, type: BIGSERIAL, constraints: {primaryKey: true, nullable: false}}
              - column: {name: user_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_tg_user, references: "users(id)"}}
              - column: {name: link_code, type: VARCHAR(64), constraints: {nullable: false, unique: true}}
              - column: {name: chat_id, type: BIGINT}
              - column: {name: linked, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: "CURRENT_TIMESTAMP", constraints: {nullable: false}}
      rollback:
        - dropTable: {tableName: telegram_links}
