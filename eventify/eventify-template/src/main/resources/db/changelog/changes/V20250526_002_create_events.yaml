databaseChangeLog:
  - changeSet:
      id: 002-create-events
      author: eventify
      changes:
        - createTable:
            tableName: events
            columns:
              - column: {name: id, type: BIGSERIAL, constraints: {primaryKey: true, nullable: false}}
              - column: {name: title, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: description, type: TEXT}
              - column: {name: date_time, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: total_tickets, type: INT, constraints: {nullable: false}}
              - column: {name: cover_url, type: VARCHAR(1024)}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: "CURRENT_TIMESTAMP", constraints: {nullable: false}}
        - createIndex:
            indexName: idx_events_date_time
            tableName: events
            columns: [{column: {name: date_time}}]
      rollback:
        - dropTable: {tableName: events}
