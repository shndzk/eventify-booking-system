databaseChangeLog:
  - changeSet:
      id: 003-create-bookings
      author: eventify
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column: {name: id, type: BIGSERIAL, constraints: {primaryKey: true, nullable: false}}
              - column: {name: user_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_bookings_user, references: "users(id)"}}
              - column: {name: event_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_bookings_event, references: "events(id)"}}
              - column: {name: ticket_count, type: INT, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: "CURRENT_TIMESTAMP", constraints: {nullable: false}}
              - column: {name: expiry_time, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: confirmed, type: BOOLEAN, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: timezone, type: VARCHAR(64)}
        - createIndex: {indexName: idx_bookings_user, tableName: bookings, columns: [{column: {name: user_id}}]}
        - createIndex: {indexName: idx_bookings_event, tableName: bookings, columns: [{column: {name: event_id}}]}
      rollback:
        - dropTable: {tableName: bookings}
