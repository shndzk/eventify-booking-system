version: '3.8'

services:
  # --- БАЗА ДАННЫХ ---
  postgres:
    image: postgres:15
    container_name: eventify-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- БЭКЕНД ---
  backend:
    build: ./eventify-template  # <-- УБЕДИТЕСЬ В ПРАВИЛЬНОСТИ ПУТИ
    container_name: eventify-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_NAME=${TELEGRAM_BOT_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # --- ФРОНТЕНД --- (теперь на одном уровне с backend)
  frontend:
    build: ./booking-ui
    container_name: eventify_frontend_cont
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_USE_MOCKS=false
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: event-booking-network
